[platformio]
default_envs = xiao_esp32c3

[env]
platform = platformio/espressif32@8.0.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    gyverlibs/GyverDB@1.4.4
    gyverlibs/Settings@1.4.3
    gyverlibs/EncButton@3.7.6
    adafruit/Adafruit LSM6DS@4.7.4
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32C6 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; PCB v4 (kicad/kicad_bite): XIAO ESP32-S3, button D1, LEDs D8/D9, buzzer D10, VBAT D0
[env:bite_v4_s3]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DARDUINO_XIAO_ESP32S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DBITE_BOARD_V4
